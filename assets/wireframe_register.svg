<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <!-- BACKGROUND -->
  <rect width="1440" height="900" fill="#FFFFFF" />

  <rect x="370" y="80" width="700" height="740" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="8" />
  <rect x="370" y="80" width="700" height="80" fill="#F2F2F2" stroke="#000000" stroke-width="1.5" rx="8" />
  <text x="720" y="125" font-family="sans-serif" font-size="22" font-weight="bold" fill="#000000" text-anchor="middle">Daftar Akun Anggota Baru</text>
  <!-- Stepper -->
  <line x1="450" y1="200" x2="990" y2="200" stroke="#CCCCCC" stroke-width="2" />
  <circle cx="450" cy="200" r="14" fill="#000000" />
  <text x="450" y="204" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="450" y="230" font-family="sans-serif" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">Informasi Akun</text>

  <circle cx="720" cy="200" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="720" y="204" font-family="sans-serif" font-size="12" fill="#000000" text-anchor="middle">2</text>
  <text x="720" y="230" font-family="sans-serif" font-size="11" fill="#777777" text-anchor="middle">Unit Organisasi</text>

  <circle cx="990" cy="200" r="14" fill="#FFFFFF" stroke="#000000" stroke-width="2" />
  <text x="990" y="204" font-family="sans-serif" font-size="12" fill="#000000" text-anchor="middle">3</text>
  <text x="990" y="230" font-family="sans-serif" font-size="11" fill="#777777" text-anchor="middle">Konfirmasi</text>

  <!-- Input fields -->
  <text x="410" y="280" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000">Nama Lengkap</text>
  <rect x="410" y="290" width="620" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="430" y="315" font-family="sans-serif" font-size="14" fill="#000000">Syahri Ramadhan</text>
  
  <text x="410" y="360" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000">Nomor Handphone (WhatsApp)</text>
  <rect x="410" y="370" width="620" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="430" y="395" font-family="sans-serif" font-size="14" fill="#000000">081234567890</text>

  <text x="410" y="440" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000">Username</text>
  <rect x="410" y="450" width="620" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="430" y="475" font-family="sans-serif" font-size="14" fill="#000000">syahri.r</text>

  <text x="410" y="520" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000">Password</text>
  <rect x="410" y="530" width="620" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="430" y="555" font-family="sans-serif" font-size="14" fill="#000000">••••••••••••</text>

  <text x="410" y="600" font-family="sans-serif" font-size="13" font-weight="bold" fill="#000000">Konfirmasi Password</text>
  <rect x="410" y="610" width="620" height="40" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="430" y="635" font-family="sans-serif" font-size="14" fill="#000000">••••••••••••</text>

  <!-- Action buttons -->
  <rect x="410" y="700" width="200" height="44" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
  <text x="510" y="726" font-family="sans-serif" font-size="14" fill="#000000" text-anchor="middle">Kembali ke Login</text>

  <rect x="830" y="700" width="200" height="44" fill="#000000" stroke="#000000" stroke-width="1.5" />
  <text x="930" y="726" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Lanjut Ke Step 2</text>

</svg>